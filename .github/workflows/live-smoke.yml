name: Live smoke (real API, costs a few cents)

on:
  schedule:
    - cron: "0 4 1 * *"   # monthly, 1st at 04:00 UTC
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content-creator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: content-creator/requirements.txt
      - run: pip install -r requirements.txt
      - name: Real generate + critique
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest tests_live -q --no-header
