<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA v4.2.0 — @marianabotelho.pt</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5EFE2;--card:#FFFDF8;--border:#D4C4A8;--text:#2C1A0E;
  --muted:#8B6A4A;--brown:#3E2208;--gold:#C4922A;--gold-l:#FDF6E3;
  --rosa:#B85C5C;--rosa-l:#FAF0F0;--sage:#7A9E6F;--sage-l:#EEF4EB;
  --cream:#EFE4D0;--purple:#534AB7;--purple-l:#EEEDFE;--blue:#185FA5;--blue-l:#E6F1FB;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
#app{max-width:700px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:var(--brown);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hdr-title{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold);letter-spacing:1px}
.hdr-sub{font-size:9px;color:#EFE4D0;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin-top:1px}
.hdr-badge{font-size:10px;padding:4px 10px;border-radius:20px;font-weight:600;cursor:pointer;border:none;background:var(--gold);color:var(--brown)}
.nav{display:flex;background:var(--card);border-bottom:2px solid var(--border);flex-shrink:0;overflow-x:auto}
.nav-btn{flex:1;min-width:65px;padding:10px 4px;font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;background:var(--card);color:var(--muted);border:none;border-bottom:3px solid transparent;cursor:pointer;transition:all .18s;margin-bottom:-2px;white-space:nowrap}
.nav-btn:hover{color:var(--brown);background:var(--cream)}
.nav-btn.active{color:var(--rosa);border-bottom-color:var(--rosa)}
.body{flex:1;padding:14px;overflow-y:auto}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.card-title{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--brown);margin-bottom:3px}
.card-sub{font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.metric{background:var(--cream);border-radius:8px;padding:10px 6px;text-align:center}
.metric-val{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--brown);font-weight:600;line-height:1}
.metric-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-top:3px}
.alert-red{background:var(--rosa-l);border-left:4px solid var(--rosa);border-radius:0 8px 8px 0;padding:9px 11px;font-size:11px;color:#7a1a1a;line-height:1.5;margin-bottom:9px}
.alert-gold{background:var(--gold-l);border-left:4px solid var(--gold);border-radius:0 8px 8px 0;padding:9px 11px;font-size:11px;color:#5a3a08;line-height:1.5;margin-bottom:9px}
.alert-sage{background:var(--sage-l);border-left:4px solid var(--sage);border-radius:0 8px 8px 0;padding:9px 11px;font-size:11px;color:#2a5a22;line-height:1.5;margin-bottom:9px}
.alert-purple{background:var(--purple-l);border-left:4px solid var(--purple);border-radius:0 8px 8px 0;padding:9px 11px;font-size:11px;color:#26215C;line-height:1.5;margin-bottom:9px}
.alert-blue{background:var(--blue-l);border-left:4px solid var(--blue);border-radius:0 8px 8px 0;padding:9px 11px;font-size:11px;color:#042C53;line-height:1.5;margin-bottom:9px}
.btn{display:block;width:100%;padding:10px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:7px;text-align:center;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--rosa);color:#FFFDF8}
.btn-dark{background:var(--brown);color:var(--gold)}
.btn-sage{background:var(--sage);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-gold{background:var(--gold);color:var(--brown)}
.btn-muted{background:var(--cream);color:var(--brown);border:1.5px solid var(--border)}
.btn-sm{width:auto;padding:5px 12px;font-size:11px;margin-top:0}
.btn-row{display:flex;gap:7px;margin-top:7px}
.btn-row .btn{margin-top:0}
.area{background:var(--cream);border-radius:8px;padding:11px;margin-top:7px;font-size:12px;line-height:1.75;color:var(--text);white-space:pre-wrap;word-break:break-word}
.area.placeholder{color:var(--muted);font-style:italic;min-height:52px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--rosa);border-radius:50%;animation:spin .75s linear infinite}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600}
.pill-sage{background:var(--sage-l);color:#2a5a22;border:1px solid var(--sage)}
.pill-gold{background:var(--gold-l);color:#5a3a08;border:1px solid var(--gold)}
.pill-rosa{background:var(--rosa-l);color:#7a1a1a;border:1px solid var(--rosa)}
.pill-muted{background:var(--cream);color:var(--muted);border:1px solid var(--border)}
.pill-purple{background:var(--purple-l);color:#26215C;border:1px solid var(--purple)}
.pill-blue{background:var(--blue-l);color:#042C53;border:1px solid var(--blue)}
.pills-row{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.cal-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav-btn{background:var(--cream);border:1.5px solid var(--border);border-radius:6px;width:30px;height:30px;font-size:18px;color:var(--brown);cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-month{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--brown)}
.post-item{display:flex;gap:9px;padding:9px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:border-color .15s,background .15s}
.post-item:hover{border-color:var(--rosa);background:var(--rosa-l)}
.post-item.selected{border-color:var(--rosa);background:var(--rosa-l)}
.post-item.highlight-item{border-color:var(--gold)}
.date-box{background:var(--brown);color:var(--gold);border-radius:6px;min-width:38px;text-align:center;padding:5px 4px;flex-shrink:0}
.date-num{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1}
.date-dow{font-size:7px;text-transform:uppercase;letter-spacing:1px;opacity:.8}
.post-info{flex:1;min-width:0}
.post-title{font-size:12px;font-weight:500;color:var(--text);margin-bottom:4px;line-height:1.3}
.post-tags{display:flex;gap:4px;flex-wrap:wrap}

/* TABS */
.tabs{display:flex;gap:3px;margin-bottom:12px;overflow-x:auto;padding-bottom:1px}
.tab{flex:1;min-width:55px;padding:7px 3px;font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--brown);border:1.5px solid var(--border);border-radius:6px;cursor:pointer;text-align:center;white-space:nowrap}
.tab:hover{background:var(--border)}
.tab.active{background:var(--card);border-color:var(--rosa);color:var(--rosa)}

/* PROMPT BOX — caixa escura para copiar */
.prompt-box{background:#1C0F05;border-radius:8px;padding:12px 12px 36px 12px;margin-top:7px;position:relative}
.prompt-txt{font-size:11px;color:#EFE4D0;line-height:1.65;white-space:pre-wrap;max-height:200px;overflow-y:auto;word-break:break-word}
.copy-btn{position:absolute;bottom:8px;right:8px;background:var(--gold);border:none;border-radius:4px;padding:4px 10px;font-size:10px;color:var(--brown);cursor:pointer;font-weight:700}
.copy-btn:active{opacity:.75}

/* CHECKLIST */
.check-item{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--card);border:1.5px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer}
.check-item:hover{border-color:var(--sage)}
.check-item.done{background:var(--sage-l);border-color:var(--sage)}
.check-box{width:18px;height:18px;border-radius:4px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;color:#fff}
.check-item.done .check-box{background:var(--sage);border-color:var(--sage)}
.check-label{font-size:12px;color:var(--text)}
.check-item.done .check-label{color:#2a5a22}
.progress-bar-bg{background:var(--border);border-radius:20px;height:5px;margin-bottom:10px}
.progress-bar{background:var(--sage);height:5px;border-radius:20px;transition:width .3s}

/* FORM */
.form-group{margin-bottom:10px}
.form-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--card);color:var(--text)}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--rosa)}
.form-textarea{min-height:60px;resize:vertical;line-height:1.5}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.form-check{display:flex;align-items:center;gap:7px;cursor:pointer}
.form-check input{width:15px;height:15px;cursor:pointer;accent-color:var(--rosa)}
.form-check label{font-size:12px;color:var(--text);cursor:pointer}
.modal-overlay{position:fixed;inset:0;background:rgba(62,34,8,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--card);border-radius:16px 16px 0 0;padding:18px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--brown)}
.modal-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer}

/* STORIES */
.story-card{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:11px;margin-bottom:7px}
.story-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--brown);color:var(--gold);font-size:10px;font-weight:700;flex-shrink:0}
.funnel-badge{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:700;border:none}

.foot{text-align:center;padding:7px;font-size:10px;color:var(--muted);background:var(--bg);border-top:1px solid var(--border);flex-shrink:0}

/* GRID CALENDARIO */
.cal-grid{width:100%;border-collapse:collapse;font-size:11px}
.cal-grid th{padding:6px 2px;text-align:center;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border)}
.cal-grid td{vertical-align:top;padding:3px;border:1px solid var(--border);min-height:52px;width:14.28%;position:relative;cursor:pointer}
.cal-grid td:hover{background:var(--cream)}
.cal-grid td.outro-mes{background:var(--bg);opacity:.4;cursor:default}
.cal-grid td.hoje{background:var(--gold-l)}
.cal-day-num{font-size:11px;font-weight:600;color:var(--muted);line-height:1;margin-bottom:2px}
.cal-day-num.tem-post{color:var(--brown)}
.cal-ev{font-size:8px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.cal-post-badge{display:block;font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-post-badge.reel{background:var(--sage-l);color:#2a5a22;border:1px solid var(--sage)}
.cal-post-badge.carrossel{background:var(--gold-l);color:#5a3a08;border:1px solid var(--gold)}
.cal-post-badge.imagem{background:var(--rosa-l);color:#7a1a1a;border:1px solid var(--rosa)}
.cal-post-badge.highlight{border-width:2px}
.cal-post-badge.publicado{opacity:.6}
.cal-view-toggle{display:flex;gap:4px;margin-bottom:8px}
.cal-view-btn{padding:4px 10px;font-size:11px;font-weight:600;border:1.5px solid var(--border);border-radius:6px;background:var(--cream);color:var(--brown);cursor:pointer}
.cal-view-btn.active{background:var(--brown);color:var(--gold);border-color:var(--brown)}

/* PROMPT SAVED BADGE */
.prompt-saved{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:#2a5a22;background:var(--sage-l);border:1px solid var(--sage);border-radius:12px;padding:2px 8px;margin-left:6px}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div><div class="hdr-title">AURA ✦</div><div class="hdr-sub" id="hdr-handle">@marianabotelho.pt</div>
    <div style="font-size:8px;color:var(--gold);opacity:.5;letter-spacing:1.5px;" id="hdr-version">v4.2.0</div></div>
    <button class="hdr-badge" onclick="setMod(5)">⚙ Config</button>
  </div>
  <div class="nav" id="nav-bar">
    <button class="nav-btn active" id="nb-0" onclick="setMod(0)">◉ Dash</button>
    <button class="nav-btn" id="nb-1" onclick="setMod(1)">◫ Cal</button>
    <button class="nav-btn" id="nb-2" onclick="setMod(2)">✦ Post</button>
    <button class="nav-btn" id="nb-3" onclick="setMod(3)">📱 Stories</button>
    <button class="nav-btn" id="nb-4" onclick="setMod(4)">🎯 Ads</button>
    <button class="nav-btn" id="nb-5" onclick="setMod(5)">⚙ Config</button>
    <button class="nav-btn" id="nb-6" onclick="setMod(6)">📥 Project</button>
  </div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot-txt">@marianabotelho.pt · Publicar às 13h00 · Mín. 3 posts/semana · Stories diários</div>
<div style="text-align:center;padding:2px;font-size:9px;color:var(--muted);background:var(--bg);letter-spacing:1px;" id="version-bar">AURA v4.2.0 · 2026-05-26</div>
</div>
<div id="modal" style="display:none" class="modal-overlay" onclick="fecharModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" onclick="fecharModal()">×</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>

// ═══ LOCALSTORAGE ════════════════════════════════════════════════════════════
var LS={
  get:function(k){try{var v=localStorage.getItem("aura_"+k);return v?JSON.parse(v):null;}catch(e){return null;}},
  set:function(k,v){try{localStorage.setItem("aura_"+k,JSON.stringify(v));}catch(e){}},
  del:function(k){try{localStorage.removeItem("aura_"+k);}catch(e){}}
};

// ═══ VERSÃO ══════════════════════════════════════════════════════════════════
var AURA_VERSION = {
  version: "4.2.0",
  build:   "2026-05-26",
  label:   "AURA v4.2.0 · 2026-05-26"
};


// ═══ CONFIGURAÇÃO — 100% dinâmica, tudo sai daqui ══════════════════════════════
var CFG_DEFAULT = {
  // IDENTIDADE
  handle:        "@marianabotelho.pt",
  nome:          "Mariana Botelho",
  titulo:        "Terapeuta Holística | Farmacêutica PT/BR",
  localizacao:   "Oeiras, Portugal",
  website:       "bio.site/marianabotelho.pt",

  // POSICIONAMENTO
  descricao:     "Terapeuta holística com formação em Farmácia, Reiki Mestre, HAM/HET Host. Guio mulheres no caminho de volta ao seu centro, integrando ciência e sabedoria ancestral.",
  proposta:      "Integro o saber científico da Farmácia com as terapias energéticas e a sabedoria das plantas para te guiar num processo de transformação real e duradouro.",
  audiencia:     "Mulheres 40-60 anos, Portugal e Brasil. Em transição de vida, a procurar equilíbrio emocional, reconexão com o próprio corpo e sabedoria interior.",
  tom:           "Íntimo, poético, directo. Tuteia. Português de Portugal. Autoridade com proximidade. Emojis moderados (máx 3). Nunca linguagem de vendas agressiva.",

  // SERVIÇOS (por ordem de prioridade)
  servicos: [
    {nome:"Consulta Individual",     desc:"Sessão personalizada integrando as terapias adequadas ao teu momento.",  preco:"A definir", tipo:"servico"},
    {nome:"Ativação HAM",             desc:"Harmonia, Amor e Manifestação — activação energética individual.",         preco:"A definir", tipo:"servico"},
    {nome:"Ativação HET",             desc:"Harmonia, Equilíbrio e Transformação — activação energética individual.", preco:"A definir", tipo:"servico"},
    {nome:"Reiki Usui",               desc:"Sessão de Reiki para reequilíbrio energético e emocional.",               preco:"A definir", tipo:"servico"},
    {nome:"Leitura de Aura",          desc:"Leitura e interpretação do campo energético.",                            preco:"A definir", tipo:"servico"},
    {nome:"Workshops Cosméticos",     desc:"Aprende a criar os teus próprios cosméticos naturais com óleos essenciais.", preco:"A definir", tipo:"workshop"},
    {nome:"Imersão Meditativa",       desc:"Experiência profunda de meditação e reconexão.",                          preco:"A definir", tipo:"workshop"},
    {nome:"Retiro HAM",               desc:"Retiro presencial de activação HAM em grupo.",                            preco:"A definir", tipo:"workshop"}
  ],

  // PRODUTOS (segundo plano)
  produtos: [
    {nome:"Elixir Limpeza",   desc:"Spray energético de limpeza com ervas e cristais. 100ml.",  preco:"38€"},
    {nome:"Escalda-pés",      desc:"Ritual de escalda-pés com ervas medicinais.",               preco:"A definir"},
    {nome:"Cosméticos",       desc:"Cosméticos naturais artesanais com óleos essenciais.",      preco:"A definir"}
  ],

  // PILARES DE CONTEÚDO
  pilares: [
    {nome:"Educação",    pct:50, desc:"Explicar terapias, plantas, rituais, ciência por trás do espiritual"},
    {nome:"Bastidores",  pct:20, desc:"O dia a dia como terapeuta, preparação de sessões, o espaço"},
    {nome:"Serviços",    pct:15, desc:"Promover consultas, workshops e imersões"},
    {nome:"Produtos",    pct:10, desc:"Elixir e outros produtos — contexto de uso, não de loja"},
    {nome:"Depoimentos", pct:5,  desc:"Partilhar transformações de clientes (com autorização)"}
  ],

  // CTAs POR CATEGORIA
  ctasServicos:  "CONSULTA, SESSAO, WORKSHOP, IMERSAO, AGENDA, LISTA, ESPERA, RETIRO",
  ctasEducacao:  "QUERO SABER, REIKI, FITOTERAPIA, APOMETRIA, AURA, PLANTAS, HAM, HET",
  ctasComunidade:"EU VOLTEI, COMIGO, SINTO, SIM, QUERO",
  ctasProdutos:  "ELIXIR, ESCALDA, COSMETICOS",
  // Todos os CTAs num string (para uso em prompts)
  get ctas(){ return [this.ctasServicos, this.ctasEducacao, this.ctasComunidade, this.ctasProdutos].join(", "); },

  // FORMATO DE REELS (voice-over com imagens — estilo actual dela)
  formatoReels:  "Voice-over com imagens de natureza, rituais e bastidores. Sem falar directamente para a câmara.",
  ambientes:     "Natureza (floresta, rio, plantas), espaço de terapia, ritual com ervas e cristais, bastidores de preparação.",

  // FERRAMENTAS DISPONÍVEIS
  ferramentas: [
    {nome:"Gemini Plus",  uso:"Geração de imagens (Imagen 3) e vídeos curtos para Reels"},
    {nome:"Canva",        uso:"Design de carrosseis, stories, imagens com texto, templates"},
    {nome:"CapCut Pro",   uso:"Montagem de Reels — voice-over, legendas automáticas, música, cortes"}
  ],

  // SETTINGS
  budgetAds:    50,
  ofertaAtiva:  "",
  horarioPost:  "13h00",
  freqSemanal:  3
};

var CFG = Object.assign({}, CFG_DEFAULT, LS.get("cfg") || {});

// Helpers para aceder aos dados do CFG
function cfgServicosStr(){
  return (CFG.servicos||[]).map(function(s){return s.nome+(s.preco&&s.preco!=="A definir"?" ("+s.preco+")":"");}).join(", ");
}
function cfgProdutosStr(){
  return (CFG.produtos||[]).map(function(p){return p.nome+(p.preco&&p.preco!=="A definir"?" — "+p.preco:"");}).join(", ");
}
function cfgFerramentasStr(){
  return (CFG.ferramentas||[]).map(function(f){return f.nome+": "+f.uso;}).join(". ");
}

function salvarCFG(){ LS.set("cfg", CFG); }

// ═══ STATE ═══════════════════════════════════════════════════════════════════
var STATE={
  mod:0,sel:null,
  mes:new Date().getMonth()+1,
  ano:new Date().getFullYear(),
  tab:0,
  posts:[],
  chk:LS.get("chk")||{},
  dash:LS.get("dash")||{},
  prompts:LS.get("prompts")||{},  // prompts gerados por post
  calView:LS.get("calView")||"grid",  // "grid" ou "lista"
  aiLoading:false
};

function savePrompts(){ LS.set("prompts", STATE.prompts); }
function setCalView(v){ STATE.calView=v; LS.set("calView",v); renderBody(); }

function saveChk(){LS.set("chk",STATE.chk);}

// ═══ API CLAUDE (só para análises) ═══════════════════════════════════════════
function claude(prompt,cb,sistema,tokens){
  fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:tokens||800,
      system:sistema||"Responde em português de Portugal. Retorna APENAS JSON válido, sem markdown.",
      messages:[{role:"user",content:prompt}]})
  }).then(function(r){return r.json();})
  .then(function(d){
    if(d.error){cb(new Error(d.error.message),null);return;}
    cb(null,d.content&&d.content[0]?d.content[0].text:"");
  }).catch(function(e){cb(e,null);});
}

function parseJ(raw,fb){
  if(!raw)return fb;
  try{
    var clean=raw.replace(/```json/gi,"").replace(/```/g,"").trim();
    var s=clean.indexOf("{"),e=clean.lastIndexOf("}");
    if(s<0||e<0)return fb;
    try{return JSON.parse(clean.slice(s,e+1));}catch(e1){}
    var result={};
    var re=/"(\w+)"\s*:\s*"((?:[^"\\]|\\.)*)"/g,m;
    while((m=re.exec(clean.slice(s,e+1)))!==null)result[m[1]]=m[2].replace(/\\n/g,"\n");
    var arrM=clean.slice(s,e+1).match(/"(\w+)"\s*:\s*\[([\s\S]*?)\]/g);
    if(arrM)arrM.forEach(function(a){
      var km=a.match(/"(\w+)"/),vm=a.match(/\[([\s\S]*)\]/);
      if(km&&vm){result[km[1]]=(vm[1].match(/"((?:[^"\\]|\\.)*)"/g)||[]).map(function(s2){return s2.slice(1,-1).replace(/\\n/g,"\n");});}
    });
    return Object.keys(result).length?result:fb;
  }catch(e){return fb;}
}

function pad(n){return String(n).padStart(2,"0");}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/'/g,"&#39;").replace(/"/g,"&quot;");}
function cpText(id){
  var el=document.getElementById(id);if(!el)return;
  var txt=el.textContent||el.innerText||"";
  try{
    var ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;top:-9999px;left:-9999px;opacity:0;";
    document.body.appendChild(ta);ta.focus();ta.select();document.execCommand("copy");document.body.removeChild(ta);
    var btn=event&&event.target;if(btn){var orig=btn.textContent;btn.textContent="✓ Copiado";setTimeout(function(){btn.textContent=orig;},1600);}
  }catch(e){}
}

function getCalKey(){return STATE.ano+"-"+STATE.mes;}
function carregarPosts(){
  var saved=LS.get("posts_"+getCalKey());
  if(saved){STATE.posts=saved;return;}
  if(STATE.ano===2026&&STATE.mes===6){STATE.posts=EXEMPLO_JUNHO.slice();LS.set("posts_"+getCalKey(),STATE.posts);return;}
  STATE.posts=[];
}
function salvarPosts(){LS.set("posts_"+getCalKey(),STATE.posts);}
function novoPostObj(f){
  var dia=f.dia||1;
  return{id:STATE.ano+"-"+pad(STATE.mes)+"-"+pad(dia)+"_"+Date.now(),
    dia:dia,dow:new Date(STATE.ano,STATE.mes-1,dia).getDay(),
    type:f.type||"REEL",phase:f.phase||"consistencia",
    title:f.title||"",
    servico:f.servico||"",
    produto:f.produto||f.product||"",
    pilar:f.pilar||"educacao",
    cta:f.cta||"",
    spiritual:f.spiritual||null,highlight:f.highlight||false,status:"pending"};
}
function adicionarPost(f){var p=novoPostObj(f);STATE.posts.push(p);STATE.posts.sort(function(a,b){return a.dia-b.dia;});salvarPosts();STATE.sel=p;return p;}
function atualizarPost(id,f){
  for(var i=0;i<STATE.posts.length;i++){if(STATE.posts[i].id===id){
    var p=STATE.posts[i];
    if(f.type)p.type=f.type;if(f.phase)p.phase=f.phase;
    if(f.title!==undefined)p.title=f.title;if(f.product!==undefined)p.product=f.product;
    if(f.cta!==undefined)p.cta=f.cta;if(f.spiritual!==undefined)p.spiritual=f.spiritual;
    if(f.highlight!==undefined)p.highlight=f.highlight;if(f.status)p.status=f.status;
    salvarPosts();STATE.sel=p;return p;
  }}
}
function apagarPost(id){
  STATE.posts=STATE.posts.filter(function(p){return p.id!==id;});
  salvarPosts();delete STATE.chk[id];saveChk();
  if(STATE.sel&&STATE.sel.id===id)STATE.sel=null;
}
function atualizarStatus(id,s){
  for(var i=0;i<STATE.posts.length;i++){if(STATE.posts[i].id===id){STATE.posts[i].status=s;salvarPosts();if(STATE.sel&&STATE.sel.id===id)STATE.sel=STATE.posts[i];break;}}
}

  document.getElementById("modal-body").innerHTML=
    '<div style="font-size:13px;color:var(--muted);margin-bottom:14px;">Esta acção não pode ser desfeita.</div>'
    +'<div class="btn-row"><button class="btn btn-muted" style="flex:1" onclick="fecharModal()">Cancelar</button>'
    +'<button class="btn btn-primary" style="flex:1" onclick="execApagar(\''+esc(id)+'\')">Apagar</button></div>';
  document.getElementById("modal").style.display="flex";
}
function execApagar(id){apagarPost(id);fecharModal();STATE.mod=1;for(var i=0;i<5;i++){var b=document.getElementById("nb-"+i);if(b)b.className="nav-btn"+(i===1?" active":"");}renderBody();}

// ═══ RENDER PRINCIPAL ═════════════════════════════════════════════════════════
function renderBody(){
  var el=document.getElementById("body");if(!el)return;
  carregarPosts();
  if(STATE.mod===0)el.innerHTML=dashHTML();
  else if(STATE.mod===1)el.innerHTML=calHTML();
  else if(STATE.mod===2)el.innerHTML=postHTML();
  else if(STATE.mod===3)el.innerHTML=storiesHTML();
  else if(STATE.mod===4)el.innerHTML=adsHTML();
  else if(STATE.mod===5)el.innerHTML=configHTML();
  else if(STATE.mod===6)el.innerHTML=projectHTML();
}

// ═══ DASHBOARD ════════════════════════════════════════════════════════════════
function dashHTML(){
  var dA=STATE.dash||{};
  var W=WINDSOR;
  var engRate=(W.followers>0?((W.eng30/30)/W.followers*100).toFixed(2):"0.00");

  function sparkline(data){
    if(!data||!data.length)return"";
    var vals=data.map(function(d){return d.v||0;});
    var mx=Math.max.apply(null,vals)||1,w=160,h=32;
    var pts=vals.map(function(v,i){return(i/(vals.length-1)*w).toFixed(1)+","+(h-v/mx*(h-4)).toFixed(1);}).join(" ");
    return'<svg width="'+w+'" height="'+h+'" style="display:block;"><polyline points="'+pts+'" fill="none" stroke="var(--sage)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }

  // Audience bars
  var gaTotal=W.genderAge.reduce(function(s,g){return s+g.v;},0)||1;
  var gaBars=W.genderAge.slice(0,5).map(function(g){
    var pct=Math.round(g.v/gaTotal*100);
    var col=g.n.startsWith("F.")?"var(--rosa)":g.n.startsWith("M.")?"var(--blue)":"var(--muted)";
    return'<div style="display:flex;align-items:center;gap:7px;margin-bottom:5px;">'
      +'<div style="font-size:10px;color:var(--text);min-width:52px;">'+esc(g.n)+'</div>'
      +'<div style="flex:1;background:var(--border);border-radius:3px;height:7px;overflow:hidden;">'
      +'<div style="width:'+pct+'%;height:100%;background:'+col+';border-radius:3px;"></div></div>'
      +'<div style="font-size:10px;font-weight:600;color:var(--muted);min-width:26px;">'+pct+'%</div></div>';
  }).join("");

  var ctTotal=W.countries.reduce(function(s,c){return s+c.v;},0)||1;
  var ctBars=W.countries.slice(0,4).map(function(c){
    var pct=Math.round(c.v/ctTotal*100);
    return'<div style="display:flex;align-items:center;gap:7px;margin-bottom:5px;">'
      +'<div style="font-size:10px;color:var(--text);min-width:52px;">'+esc(c.n)+'</div>'
      +'<div style="flex:1;background:var(--border);border-radius:3px;height:7px;overflow:hidden;">'
      +'<div style="width:'+pct+'%;height:100%;background:var(--sage);border-radius:3px;"></div></div>'
      +'<div style="font-size:10px;font-weight:600;color:var(--muted);min-width:26px;">'+pct+'%</div></div>';
  }).join("");

  // Top posts table
  var topRows=W.topPosts.map(function(p,i){
    var rank=["🥇","🥈","🥉","4º","5º"][i]||"";
    var er=(p.reach>0?(p.eng/p.reach*100).toFixed(1):"0")+"%";
    return'<tr style="border-top:1px solid var(--border);">'
      +'<td style="padding:5px 3px;font-size:13px;">'+rank+'</td>'
      +'<td style="padding:5px 3px;">'+pillTipo(p.type)+'</td>'
      +'<td style="padding:5px 6px;font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(p.caption.substring(0,55))+'</td>'
      +'<td style="padding:5px 3px;font-size:11px;color:var(--muted);">'+esc(p.date)+'</td>'
      +'<td style="padding:5px 3px;font-size:11px;font-weight:600;color:var(--sage);">'+p.eng+'</td>'
      +'<td style="padding:5px 3px;font-size:11px;color:var(--brown);">'+er+'</td>'
      +(p.watchTime?'<td style="padding:5px 3px;font-size:11px;color:var(--purple);">'+p.watchTime+'s</td>':'<td></td>')
      +'</tr>';
  }).join("");

  // Analysis sections
  var perfSection=dA.perfAnalysis
    ?'<div class="alert-sage"><b>Pontos Fortes</b><br>'+esc(dA.perfAnalysis.fortes)+'</div>'
      +'<div class="alert-red"><b>A Melhorar</b><br>'+esc(dA.perfAnalysis.melhorar)+'</div>'
      +'<div class="alert-gold"><b>Próxima Acção Urgente</b><br>'+esc(dA.perfAnalysis.acao)+'</div>'
    :'<div class="area placeholder">Clica em "Analisar Perfil" para diagnóstico completo baseado nos dados reais.</div>';

  var nichoSection=dA.nichoAnalysis
    ?'<div class="alert-gold"><b>Tópicos em alta no nicho</b><br>'+esc(dA.nichoAnalysis.topicos)+'</div>'
      +'<div class="alert-purple"><b>O que está a bombar no Instagram e TikTok</b><br>'+esc(dA.nichoAnalysis.trending)+'</div>'
      +'<div class="alert-sage"><b>Oportunidades específicas para '+esc(CFG.handle)+'</b><br>'+esc(dA.nichoAnalysis.oportunidades)+'</div>'
    :'<div class="area placeholder">Clica em "Analisar Nicho" para ver tendências do Instagram e TikTok em 2026.</div>';

  var viraisSection=dA.postsViral
    ?'<div class="alert-sage"><b>Fórmula dos teus top posts</b><br>'+esc(dA.postsViral.formula)+'</div>'
      +(dA.postsViral.ideias||[]).map(function(p,i){
        var titulo=p.titulo||p.title||p.nome||"(sem titulo)";
        var tipo=p.tipo||p.type||p.formato||"REEL";
        var hook=p.hook||p.gancho||p.abertura||"";
        var cta=p.cta||p.keyword||"comentar";
        var porque=p.porque||p.motivo||p.razao||"";
        return'<div style="display:flex;gap:8px;align-items:flex-start;padding:9px 10px;background:var(--cream);border-radius:8px;margin-bottom:5px;">'
          +'<div class="story-num">'+(i+1)+'</div>'
          +'<div style="flex:1;">'
          +'<div style="font-size:12px;font-weight:600;color:var(--text);">'+esc(titulo)+'</div>'
          +'<div style="font-size:10px;color:var(--muted);margin-top:2px;">'+esc(tipo)+' · CTA: <b>'+esc(cta)+'</b></div>'
          +(hook?'<div style="font-size:10px;color:var(--purple);margin-top:2px;font-style:italic;">"'+esc(hook)+'"</div>':'')
          +(porque?'<div style="font-size:10px;color:var(--sage);margin-top:2px;">'+esc(porque)+'</div>':'')
          +'</div>'
          +'<button onclick="addPostFromIdeia('+i+')" style="background:var(--sage);color:#fff;border:none;border-radius:5px;padding:3px 8px;font-size:10px;cursor:pointer;flex-shrink:0;margin-top:2px;">+ Cal</button>'
          +'</div>';
      }).join("")
      +'<button class="btn btn-dark" onclick="gerarCalComAnalise()">✦ Gerar Calendário com esta análise</button>'
    :'<div class="area placeholder">Clica em "Posts Virais" para criar 10 ideias baseadas nos teus top posts reais + tendências do nicho.</div>';

  return'<div class="card">'
    +'<div style="display:flex;gap:11px;align-items:flex-start;margin-bottom:10px;">'
    +'<div style="width:44px;height:44px;border-radius:50%;background:var(--brown);color:var(--gold);font-family:\'Cormorant Garamond\',serif;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">M</div>'
    +'<div><div style="font-size:14px;font-weight:700;color:var(--brown);">'+esc(CFG.handle)+'</div>'
    +'<div style="font-size:11px;color:var(--muted);line-height:1.4;margin-top:2px;">'+esc(CFG.descricao)+'</div>'
    +(W.daysSince>30?'<div class="alert-red" style="margin-top:6px;font-size:10px;padding:4px 8px;">🚨 '+W.daysSince+' dias sem publicar — urgente</div>':"")
    +'</div></div>'
    +'<div class="metrics">'
    +'<div class="metric"><div class="metric-val">'+W.followers.toLocaleString("pt")+'</div><div class="metric-lbl">Seguidores</div></div>'
    +'<div class="metric"><div class="metric-val">'+W.reach30+'</div><div class="metric-lbl">Alcance 30d</div></div>'
    +'<div class="metric"><div class="metric-val">'+W.views30+'</div><div class="metric-lbl">Views 30d</div></div>'
    +'<div class="metric"><div class="metric-val" style="color:'+(parseFloat(engRate)>1?"var(--sage)":"var(--rosa)")+';">'+engRate+'%</div><div class="metric-lbl">Eng. Rate</div></div>'
    +'</div>'
    +sparkline(W.daily)
    +'</div>'

    // 3 botões de análise
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:4px;">'
    +'<button class="btn btn-sage" style="margin-top:0;" id="btn-perfil" onclick="analisarPerfil()">◉ Análise Perfil</button>'
    +'<button class="btn btn-purple" style="margin-top:0;" id="btn-nicho" onclick="analisarNicho()">✦ Análise Nicho</button>'
    +'<button class="btn btn-dark" style="margin-top:0;" id="btn-viral" onclick="postsVirais()">🔥 Posts Virais</button>'
    +'</div>'

    // Perfil
    +'<div class="card" id="sec-perfil">'
    +'<div class="card-title">◉ Análise de Perfil</div>'
    +'<div class="card-sub">Dados reais Windsor.ai · '+new Date().toLocaleDateString("pt-PT")+'</div>'
    +'<div style="overflow-x:auto;margin-bottom:10px;"><table style="width:100%;border-collapse:collapse;font-size:11px;">'
    +'<thead><tr style="text-align:left;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">'
    +'<th style="padding:4px;">#</th><th>Tipo</th><th>Legenda</th><th>Data</th><th>Eng.</th><th>Taxa</th><th>Watch</th></tr></thead>'
    +'<tbody>'+topRows+'</tbody></table></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">'
    +'<div><div style="font-size:10px;font-weight:600;color:var(--brown);margin-bottom:5px;">Género/Idade</div>'+gaBars+'</div>'
    +'<div><div style="font-size:10px;font-weight:600;color:var(--brown);margin-bottom:5px;">País</div>'+ctBars+'</div></div>'
    +perfSection

    +(dA.perfAnalysis?'':'<button class="btn btn-sage" onclick="analisarPerfil()">◉ Gerar Análise com IA</button>')
    +'</div>'

    // Nicho
    +'<div class="card" id="sec-nicho">'
    +'<div class="card-title">✦ Análise de Nicho</div>'

    +nichoSection
    +(dA.analisandoNicho?'<div style="display:flex;align-items:center;gap:8px;padding:8px 0;"><div class="spinner"></div><span style="font-size:11px;color:var(--muted);">A pesquisar tendências...</span></div>':'')
    +(dA.nichoAnalysis?'':'<button class="btn btn-purple" onclick="analisarNicho()">✦ Gerar Análise com IA</button>')
    +'</div>'

    // Posts Virais
    +'<div class="card" id="sec-viral">'
    +'<div class="card-title">🔥 Posts Virais</div>'

    +viraisSection
    +(dA.analisandoViral?'<div style="display:flex;align-items:center;gap:8px;padding:8px 0;"><div class="spinner"></div><span style="font-size:11px;color:var(--muted);">A criar ideias virais...</span></div>':'')
    +(dA.postsViral?'':'<button class="btn btn-dark" onclick="postsVirais()">🔥 Gerar Posts Virais com IA</button>')
    +'</div>';
}

// ═══ CALENDÁRIO ══════════════════════════════════════════════════════════════
function calHTML(){
  var ps=STATE.posts;
  var rs=0,cs=0,is=0,pub=0;
  ps.forEach(function(p){
    if(p.type==="REEL")rs++;else if(p.type==="CARROSSEL")cs++;else is++;
    if(p.status==="publicado")pub++;
  });

  // Build post map by day for grid
  var postsByDay={};
  ps.forEach(function(p){ if(!postsByDay[p.dia])postsByDay[p.dia]=[]; postsByDay[p.dia].push(p); });

  // Events map
  var evMap={};
  (EVENTOS[STATE.mes]||[]).forEach(function(e){ evMap[e.d]=(evMap[e.d]||[]); evMap[e.d].push(e.l); });

  var header='<div class="card">'
    +'<div class="cal-nav-row">'
    +'<button class="cal-nav-btn" onclick="chMes(-1)">‹</button>'
    +'<div style="text-align:center;"><span class="cal-month">'+MESES[STATE.mes]+' '+STATE.ano+'</span>'
    +'<div style="font-size:10px;color:var(--muted);margin-top:1px;">'+ps.length+' posts · '+pub+' publicados</div></div>'
    +'<button class="cal-nav-btn" onclick="chMes(1)">›</button>'
    +'</div>'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
    +'<div class="pills-row" style="margin:0;">'
    +'<span class="pill pill-sage">R '+rs+'</span>'
    +'<span class="pill pill-gold">C '+cs+'</span>'
    +'<span class="pill pill-rosa">I '+is+'</span>'
    +'</div>'
    +'<div class="cal-view-toggle">'
    +'<button class="cal-view-btn'+(STATE.calView==="grid"?" active":"")+'" data-v="grid" onclick="setCalView(this.dataset.v)">⊞ Grid</button>'    +'<button class="cal-view-btn'+(STATE.calView==="lista"?" active":"")+'" data-v="lista" onclick="setCalView(this.dataset.v)">≡ Lista</button>'    +'</div>'
    +'</div>'
    +'<div class="btn-row">'
    +'<button class="btn btn-sage btn-sm" onclick="abrirFormPost(null)">+ Post</button>'
    +'<button class="btn btn-dark btn-sm" onclick="gerarCalIA()" id="btn-geria">✦ Gerar com IA</button>'
    +'</div></div>';

  if(STATE.aiLoading){
    return header+'<div class="card" style="text-align:center;padding:22px;">'+spinner("A gerar calendário para "+MESES[STATE.mes]+"...")+'</div>';
  }

  if(ps.length===0){
    return header+'<div class="card" style="text-align:center;padding:24px;">'
      +'<div style="font-size:28px;margin-bottom:8px;">📅</div>'
      +'<div style="font-family:\'Cormorant Garamond\',serif;font-size:17px;color:var(--brown);margin-bottom:5px;">Sem posts para '+MESES[STATE.mes]+'</div>'
      +'<div style="font-size:11px;color:var(--muted);margin-bottom:12px;">Cria manualmente ou usa a IA.</div>'
      +'<button class="btn btn-dark" onclick="gerarCalIA()">✦ Gerar Calendário com IA</button>'
      +'<button class="btn btn-muted" style="margin-top:6px;" onclick="abrirFormPost(null)">+ Criar Manualmente</button>'
      +'</div>';
  }

  var body="";

  if(STATE.calView==="grid"){
    // Grid view
    var hoje=new Date(); var hd=hoje.getDate(),hm=hoje.getMonth()+1,ha=hoje.getFullYear();
    var firstDay=new Date(STATE.ano,STATE.mes-1,1).getDay(); // 0=dom
    var daysInMonth=new Date(STATE.ano,STATE.mes,0).getDate();
    var daysInPrev=new Date(STATE.ano,STATE.mes-1,0).getDate();
    // Start week on Monday
    var startOffset=(firstDay===0)?6:firstDay-1;

    body+='<div class="card" style="padding:10px;">'
      +'<table class="cal-grid"><thead><tr>';
    ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].forEach(function(d){
      body+='<th>'+d+'</th>';
    });
    body+='</tr></thead><tbody>';

    var day=1, nextDay=1, cell=0, totalCells=Math.ceil((startOffset+daysInMonth)/7)*7;
    body+='<tr>';
    for(var i=0;i<totalCells;i++){
      if(i>0&&i%7===0) body+='</tr><tr>';
      var isCurrentMonth=i>=startOffset&&day<=daysInMonth;
      var isHoje=isCurrentMonth&&day===hd&&STATE.mes===hm&&STATE.ano===ha;
      var dayNum=isCurrentMonth?day:(i<startOffset?(daysInPrev-startOffset+i+1):nextDay++);
      var cls="";
      if(!isCurrentMonth)cls+=" outro-mes";
      if(isHoje)cls+=" hoje";

      body+='<td class="'+cls.trim()+'" onclick="'+( isCurrentMonth?'clickGridDay('+day+')':'')+'">'
        +'<div class="cal-day-num'+(isCurrentMonth&&postsByDay[day]?' tem-post':'')+'">'+dayNum+'</div>';

      if(isCurrentMonth){
        // Events
        (evMap[day]||[]).slice(0,1).forEach(function(ev){
          body+='<div class="cal-ev">'+ev.substring(0,12)+'</div>';
        });
        // Posts
        (postsByDay[day]||[]).forEach(function(p){
          var tc=p.type==="REEL"?"reel":p.type==="CARROSSEL"?"carrossel":"imagem";
          var isSel=STATE.sel&&STATE.sel.id===p.id;
          var hasPr=!!(STATE.prompts[p.id]&&STATE.prompts[p.id].texto);
          var tc2=p.type==="REEL"?"reel":p.type==="CARROSSEL"?"carrossel":"imagem";
          var badgeCls="cal-post-badge "+tc2+(p.highlight?" highlight":"")+(p.status==="publicado"?" publicado":"")+(isSel?" selected":"");
          var badgeTxt=p.type.substring(0,1)+(p.cta?" ·"+p.cta.substring(0,5):"")+(hasPr?" ✓":"");
          body+="<span class=\""+badgeCls+"\" onclick=\"event.stopPropagation();selPost('"+esc(p.id)+"');\" title=\""+esc(p.title)+(hasPr?" — prompt guardado":"")+"\">"
            +esc(badgeTxt)+"</span>";
        });
        day++;
      }
      body+='</td>';
    }
    body+='</tr></tbody></table>';

    // Legend
    body+='<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">'
      +'<span class="cal-post-badge reel" style="cursor:default;">R Reel</span>'
      +'<span class="cal-post-badge carrossel" style="cursor:default;">C Carrossel</span>'
      +'<span class="cal-post-badge imagem" style="cursor:default;">I Imagem</span>'
      +'<span style="font-size:9px;color:var(--muted);align-self:center;">Borda dupla = destaque · Clica no dia para criar post</span>'
      +'</div></div>';
  } else {
    // Lista view
    body+='<div class="card">';
    ps.forEach(function(p){
      var sel=STATE.sel&&STATE.sel.id===p.id;
      var temPrompt=!!(STATE.prompts[p.id]&&STATE.prompts[p.id].texto);
      body+='<div class="post-item'+(sel?" selected":"")+(p.highlight?" highlight-item":"\"")+'\" onclick=\"selPost(\''+esc(p.id)+'\')">'
        +'<div class="date-box"><div class="date-num">'+pad(p.dia)+'</div><div class="date-dow">'+DOWS[p.dow]+'</div></div>'
        +'<div class="post-info">'
        +'<div class="post-title">'+esc(p.title||"(sem título)")+'</div>'
        +'<div class="post-tags">'+pillTipo(p.type)+' '+pillPhase(p.phase)+' '
        +(p.highlight?'<span class="pill" style="background:var(--gold);color:var(--brown);border:none;">✦</span> ':'')
        +(p.spiritual?'<span class="pill pill-gold">🌙</span> ':'')
        +(temPrompt?'<span class="pill pill-sage">✓ Prompt</span> ':'')
        +pillStatus(p.status)+'</div></div>'
        +'<div style="font-size:18px;color:var(--muted);">›</div></div>';
    });
    body+='</div>';
  }

  // Selected post action bar
  var actionBar="";
  if(STATE.sel){
    actionBar='<div class="card" style="border-color:var(--sage);background:var(--sage-l);">'
      +'<div style="font-size:12px;font-weight:600;color:#2a5a22;margin-bottom:8px;">'
      +'✓ '+esc(STATE.sel.title.substring(0,48))+(STATE.sel.title.length>48?"...":"")+'</div>'
      +'<div class="btn-row">'
      +'<button class="btn btn-primary" style="flex:2" onclick="abrirPost(\''+esc(STATE.sel.id)+'\')">→ Criar Conteúdo</button>'
      +'<button class="btn btn-muted" style="flex:1" onclick="abrirFormPost(STATE.sel)">✏</button>'
      +'<button class="btn btn-muted" style="flex:1;border-color:var(--rosa);color:var(--rosa);" onclick="confirmarApagar(\''+esc(STATE.sel.id)+'\')">🗑</button>'
      +'</div></div>';
  }

  return header+body+actionBar;
}

function clickGridDay(dia){
  // Check if there are posts on this day
  var postsDia=STATE.posts.filter(function(p){return p.dia===dia;});
  if(postsDia.length===1){
    selPost(postsDia[0].id);
  } else if(postsDia.length>1){
    // Select first, let user navigate
    selPost(postsDia[0].id);
  } else {
    // No post — open form pre-filled with this day
    abrirFormPost({dia:dia});
  }
}


// ═══ POST DETAIL ══════════════════════════════════════════════════════════════

  var p=STATE.sel;
  var phaseCol={reativacao:"var(--sage)",consistencia:"var(--gold)",conversao:"var(--rosa)"}[p.phase]||"var(--muted)";
  return'<div class="card">'

function buildBriefing(p){
  var pilarObj=(CFG.pilares||[]).find(function(pl){
    return pl.nome.toLowerCase()===(p.pilar||"educacao").toLowerCase();
  });
  var pilarDesc=pilarObj?pilarObj.desc:"";
  var servicoObj=(CFG.servicos||[]).find(function(s){return s.nome===(p.servico||"");});
  var NL="\n";
  return "=== BRIEFING DO POST ==="
    +NL+"Data: "+pad(p.dia)+" de "+MESES[STATE.mes]+" "+STATE.ano+" (publicar as "+CFG.horarioPost+")"
    +NL+"Formato: "+p.type
    +NL+"Titulo / Tema: "+p.title
    +NL+"Pilar de conteudo: "+(p.pilar||"educacao")+(pilarDesc?" -- "+pilarDesc:"")
    +NL+"Fase do funil: "+({
      reativacao:"Reativacao -- reconectar com a audiencia, educar, criar confianca",
      consistencia:"Consistencia -- provar autoridade, mostrar bastidores, construir relacao",
      conversao:"Conversao -- convidar a agir de forma natural, sem pressao"
    }[p.phase]||p.phase)
    +NL+"CTA (palavra-chave nos comentarios): "+p.cta
    +(p.servico&&servicoObj?NL+"Servico destacado: "+p.servico+" -- "+servicoObj.desc:p.servico?NL+"Servico mencionado: "+p.servico:"")

    +NL+"Formula: voice-over poetico + imagens natureza/ritual + CTA natural = 45+ comentarios"
    +NL;
}

function guardarPromptPost(pid, tipo, conteudo){
  if(!STATE.prompts[pid]) STATE.prompts[pid]={};
  var agora=new Date();
  var ts=agora.toLocaleDateString("pt-PT")+" "+agora.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
  var histKey=tipo+"_hist";
  if(!STATE.prompts[pid][histKey]) STATE.prompts[pid][histKey]=[];
  if(STATE.prompts[pid][tipo]){
    STATE.prompts[pid][histKey].unshift({conteudo:STATE.prompts[pid][tipo],data:STATE.prompts[pid][tipo+"_data"]||"anterior"});
    STATE.prompts[pid][histKey]=STATE.prompts[pid][histKey].slice(0,3);
  }
  STATE.prompts[pid][tipo]=conteudo;
  STATE.prompts[pid][tipo+"_data"]=ts;
  STATE.prompts[pid].ultimaAtualizacao=ts;
  savePrompts();
}

function expPost(btn){
  exportarPromptPost(btn.getAttribute("data-eid"));
}

function exportarPromptPost(pid){
  var p=STATE.posts.find(function(x){return x.id===pid;});
  if(!p)return;
  var pr=STATE.prompts[pid]||{};
  var NL="\n";
  var md="# Post — "+pad(p.dia)+" de "+MESES[STATE.mes]+" "+STATE.ano+" | "+p.type+NL
    +"Tema: "+p.title+NL
    +"Pilar: "+(p.pilar||"—")+" | CTA: "+p.cta+NL
    +(p.servico?"Servico: "+p.servico+NL:"")
    +(p.spiritual?"Data especial: "+p.spiritual+NL:"")
    +"Exportado: "+new Date().toLocaleString("pt-PT")+NL
    +NL+"---"+NL+NL;
  if(pr.texto) md+="## Prompt de Texto"+NL+"Gerado: "+(pr.texto_data||"—")+NL+NL+pr.texto+NL+NL;
  (pr.texto_hist||[]).forEach(function(v){md+="### Texto anterior ("+v.data+")"+NL+v.conteudo+NL+NL;});
  if(pr.imagem) md+="## Prompt de Imagem/Video"+NL+"Gerado: "+(pr.imagem_data||"—")+NL+NL+pr.imagem+NL+NL;
  if(pr.stories) md+="## Prompt de Stories"+NL+"Gerado: "+(pr.stories_data||"—")+NL+NL+pr.stories+NL+NL;
  if(pr.ads) md+="## Prompt de Ads"+NL+pr.ads+NL+NL;
  md+="---"+NL+"AURA v4 | "+CFG.handle+NL;
  downloadMd(md,"post_"+pad(p.dia)+"_"+pad(STATE.mes)+"_"+STATE.ano+".md");
  var btn=event&&event.target;
  if(btn){var orig=btn.textContent;btn.textContent="Exportado!";setTimeout(function(){btn.textContent=orig;},2000);}
}

function exportarMes(){
  var ps=STATE.posts;
  if(!ps||ps.length===0){alert("Sem posts para exportar neste mes.");return;}
  var NL="\n";
  var md="# Calendario — "+MESES[STATE.mes]+" "+STATE.ano+" | "+CFG.handle+NL
    +"Exportado: "+new Date().toLocaleString("pt-PT")+NL
    +"Total: "+ps.length+" posts"+NL+NL+"---"+NL+NL;
  ps.sort(function(a,b){return a.dia-b.dia;}).forEach(function(p){
    var pr=STATE.prompts[p.id]||{};
    md+="## "+pad(p.dia)+" | "+p.type+" | "+p.title+NL
      +"Pilar: "+(p.pilar||"—")+" | CTA: "+p.cta+" | Status: "+p.status+NL
      +(p.spiritual?"Data especial: "+p.spiritual+NL:"")+NL;
    if(pr.texto) md+="### Prompt Texto ("+pr.texto_data+")"+NL+pr.texto+NL+NL;
    if(pr.imagem) md+="### Prompt Imagem ("+pr.imagem_data+")"+NL+pr.imagem+NL+NL;
    if(pr.stories) md+="### Prompt Stories ("+pr.stories_data+")"+NL+pr.stories+NL+NL;
    if(!pr.texto&&!pr.imagem&&!pr.stories) md+="*Sem prompts gerados ainda.*"+NL+NL;
    md+="---"+NL+NL;
  });
  md+="AURA v4 | "+CFG.handle+NL;
  downloadMd(md,"calendario_"+MESES[STATE.mes].toLowerCase()+"_"+STATE.ano+".md");
  var btn=event&&event.target;
  if(btn){var orig=btn.textContent;btn.textContent="Exportado!";setTimeout(function(){btn.textContent=orig;},2000);}
}

    guardarPromptPost(p.id,"stories",clean);
    STATE.tab=2; renderBody();
  }, buildSistema(), 1200);
}


function renderBody(){
  var el=document.getElementById("body");if(!el)return;
  carregarPosts();
  if(STATE.mod===0)el.innerHTML=dashHTML();

  else if(STATE.mod===4)el.innerHTML=adsHTML();
  else if(STATE.mod===5)el.innerHTML=configHTML();
  else if(STATE.mod===6)el.innerHTML=projectHTML();
}

    var pts=vals.map(function(v,i){return(i/(vals.length-1)*w).toFixed(1)+","+(h-v/mx*(h-4)).toFixed(1);}).join(" ");

function calHTML(){
  var ps=STATE.posts;
  var rs=0,cs=0,is=0,pub=0;

    +'<div style="text-align:center;"><span class="cal-month">'+MESES[STATE.mes]+' '+STATE.ano+'</span>'

    +'<button class="btn btn-dark btn-sm" onclick="gerarCalIA()" id="btn-geria">✦ Gerar com IA</button>'

  if(STATE.aiLoading){h+='<div class="card" style="text-align:center;padding:22px;">'+spinner("A gerar calendário para "+MESES[STATE.mes]+"...")+'</div>';return h;}
  if(ps.length===0){

      +'<div style="font-size:28px;margin-bottom:8px;">📅</div>'

      +'</div>';
    return h;

  h+='<div class="card">';
  ps.forEach(function(p){
    var sel=STATE.sel&&STATE.sel.id===p.id;

      +'<div class="post-info"><div class="post-title">'+esc(p.title||"(sem título)")+'</div>'
      +'<div class="post-tags">'+pillTipo(p.type)+' '+pillPhase(p.phase)+' '
      +(p.highlight?'<span class="pill pill-special" style="background:var(--gold);color:var(--brown);">✦</span> ':'')
      +(p.spiritual?'<span class="pill pill-gold">🌙</span> ':'')
      +pillStatus(p.status)+'</div></div>'
      +'<div style="font-size:18px;color:var(--muted);">›</div></div>';
  });
  h+='</div>';
  if(STATE.sel){
    h+='<div class="card" style="border-color:var(--sage);background:var(--sage-l);">'
      +'<div style="font-size:12px;font-weight:600;color:#2a5a22;margin-bottom:8px;">✓ '+esc(STATE.sel.title.substring(0,50))+(STATE.sel.title.length>50?"...":"")+'</div>'

      +'</div></div>';
  }
  return h;
}

  var btn=document.getElementById("btn-geria");

  var evs=(EVENTOS[STATE.mes]||[]).map(function(e){return e.d+": "+e.l;}).join(", ");

  claude(
    "Calendario Instagram "+MESES[STATE.mes]+" "+STATE.ano+" para "+CFG.handle+"."
    +" Audiencia: "+CFG.audiencia+" Produtos: "+CFG.produtos
    +" Datas especiais: "+evs+"."
    +(viralCtx?" Incorpora: "+viralCtx:"")
    +" Regras: Seg=REEL, Qua=CARROSSEL, Sex=REEL. Mix: 40% REEL, 35% CARROSSEL, 25% IMAGEM."

    +" Gera exactamente 10 posts. Titulos criativos.",
    function(err,raw){
      STATE.aiLoading=false;
      if(err||!raw){alert("Erro ao gerar. "+(err?err.message:""));renderBody();return;}
      var d=parseJ(raw,null);
      var arr=d&&d.posts?d.posts:(Array.isArray(d)?d:null);
      if(!arr||arr.length===0){
        var dim2=new Date(STATE.ano,STATE.mes,0).getDate();
        var evMap={};(EVENTOS[STATE.mes]||[]).forEach(function(e){evMap[e.d]=e;});
        var dias=[],tipos=["REEL","CARROSSEL","IMAGEM","REEL","CARROSSEL","REEL","IMAGEM","CARROSSEL","REEL","REEL"];
        var temas=["Ritual de inicio de mes","Educacao sobre os produtos","Depoimento de cliente","Data especial","Bastidores","Dicas de bem-estar","Collab","Produto em destaque","Intencoes e rituais","Gratidao e fecho"];
        for(var dd=1;dd<=dim2;dd++){var dow=new Date(STATE.ano,STATE.mes-1,dd).getDay();if(dow===1||dow===3||dow===5||evMap[dd])dias.push(dd);}
        dias=[...new Set(dias)].slice(0,10);
        arr=dias.map(function(dia,i){var ev=evMap[dia];return{dia:dia,type:tipos[i%tipos.length],phase:i<4?"reativacao":i<7?"consistencia":"conversao",title:ev?ev.l+" -- "+temas[i%temas.length]:temas[i%temas.length],product:i%3===0?CFG.produtos.split(",")[0].trim():"",cta:CFG.ctas.split(",")[i%8].trim(),spiritual:ev?ev.l:null,highlight:!!ev};});
      }
      var dim=new Date(STATE.ano,STATE.mes,0).getDate();
      STATE.posts=arr.filter(function(p){return p&&p.dia>=1&&p.dia<=dim&&p.title;})
        .map(function(p){return{id:STATE.ano+"-"+pad(STATE.mes)+"-"+pad(p.dia)+"_"+Date.now(),dia:p.dia,dow:new Date(STATE.ano,STATE.mes-1,p.dia).getDay(),type:p.type||"REEL",phase:p.phase||"consistencia",title:p.title,product:p.product||"",cta:p.cta||"comentar",spiritual:p.spiritual||null,highlight:!!p.highlight,status:"pending"};})
        .sort(function(a,b){return a.dia-b.dia;});
      salvarPosts();renderBody();
    },
    "Retorna APENAS JSON valido sem markdown.",2000
  );
}

function salvarConfigTab(){
  CFG.handle    = document.getElementById("c-handle").value.trim()||CFG.handle;
  CFG.titulo    = document.getElementById("c-titulo").value.trim()||CFG.titulo;
  CFG.proposta  = document.getElementById("c-proposta").value.trim()||CFG.proposta;
  CFG.audiencia = document.getElementById("c-audiencia").value.trim()||CFG.audiencia;
  CFG.tom       = document.getElementById("c-tom").value.trim()||CFG.tom;
  CFG.ofertaAtiva = document.getElementById("c-oferta").value.trim();
  CFG.budgetAds   = parseInt(document.getElementById("c-budget").value)||50;
  salvarCFG();
  var h=document.getElementById("hdr-handle"); if(h) h.textContent=CFG.handle;
  renderBody();
  alert("Configuracao guardada!");
}

function editarServicos(){
  document.getElementById("modal-title").textContent="Editar Servicos e Workshops";
  var rows=(CFG.servicos||[]).map(function(s,i){
    return '<div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;margin-bottom:6px;">'
      +'<input class="form-input" id="sn-'+i+'" value="'+esc(s.nome)+'" placeholder="Nome">'
      +'<select class="form-select" id="st-'+i+'">'
      +'<option value="servico"'+(s.tipo==="servico"?" selected":"")+'>Servico</option>'
      +'<option value="workshop"'+(s.tipo==="workshop"?" selected":"")+'>Workshop</option>'
      +'</select>'
      +'<input class="form-input" id="sp-'+i+'" value="'+esc(s.preco)+'" placeholder="Preco">'
      +'</div>';
  }).join("");
  document.getElementById("modal-body").innerHTML=
    '<div class="alert-sage" style="margin-bottom:10px;">Os servicos sao o foco principal. Actualiza os precos quando abrires agendas.</div>'
    +rows+'<button class="btn btn-dark" onclick="guardarServicos()">Guardar</button>';
  document.getElementById("modal").style.display="flex";
}

function guardarServicos(){
  var novos=[];
  for(var i=0;i<(CFG.servicos||[]).length;i++){
    var n=document.getElementById("sn-"+i);var t=document.getElementById("st-"+i);var p=document.getElementById("sp-"+i);
    if(n&&n.value.trim()) novos.push({nome:n.value.trim(),desc:CFG.servicos[i].desc||"",tipo:t?t.value:"servico",preco:p?p.value.trim():"A definir"});
  }
  CFG.servicos=novos; salvarCFG(); fecharModal(); renderBody();
}

function editarProdutos(){
  document.getElementById("modal-title").textContent="Editar Produtos";
  var rows=(CFG.produtos||[]).map(function(p,i){
    return '<div style="display:grid;grid-template-columns:2fr 2fr 1fr;gap:6px;margin-bottom:6px;">'
      +'<input class="form-input" id="pn-'+i+'" value="'+esc(p.nome)+'" placeholder="Nome">'
      +'<input class="form-input" id="pd-'+i+'" value="'+esc(p.desc)+'" placeholder="Descricao">'
      +'<input class="form-input" id="pp-'+i+'" value="'+esc(p.preco)+'" placeholder="Preco">'
      +'</div>';
  }).join("");
  document.getElementById("modal-body").innerHTML=
    '<div class="alert-gold" style="margin-bottom:10px;">Os produtos aparecem em segundo plano. O foco sao os servicos.</div>'
    +rows+'<button class="btn btn-dark" onclick="guardarProdutos()">Guardar</button>';
  document.getElementById("modal").style.display="flex";
}

function guardarProdutos(){
  var novos=[];
  for(var i=0;i<(CFG.produtos||[]).length;i++){
    var n=document.getElementById("pn-"+i);var d=document.getElementById("pd-"+i);var p=document.getElementById("pp-"+i);
    if(n&&n.value.trim()) novos.push({nome:n.value.trim(),desc:d?d.value.trim():"",preco:p?p.value.trim():"A definir"});
  }
  CFG.produtos=novos; salvarCFG(); fecharModal(); renderBody();
}

function editarPilares(){
  document.getElementById("modal-title").textContent="Editar Pilares de Conteudo";
  var total=(CFG.pilares||[]).reduce(function(s,p){return s+p.pct;},0);
  var rows=(CFG.pilares||[]).map(function(p,i){
    return '<div style="display:grid;grid-template-columns:2fr 60px 3fr;gap:6px;margin-bottom:6px;">'
      +'<input class="form-input" id="pin-'+i+'" value="'+esc(p.nome)+'" placeholder="Nome">'
      +'<input class="form-input" id="pip-'+i+'" type="number" min="0" max="100" value="'+p.pct+'">'
      +'<input class="form-input" id="pid-'+i+'" value="'+esc(p.desc)+'" placeholder="Descricao">'
      +'</div>';
  }).join("");
  document.getElementById("modal-body").innerHTML=
    '<div class="alert-gold" style="margin-bottom:10px;">Total actual: <b>'+total+'%</b>. A soma deve ser 100%.</div>'
    +rows+'<button class="btn btn-dark" onclick="guardarPilares()">Guardar</button>';
  document.getElementById("modal").style.display="flex";
}

function guardarPilares(){
  var novos=[],total=0;
  for(var i=0;i<(CFG.pilares||[]).length;i++){
    var n=document.getElementById("pin-"+i);var p=document.getElementById("pip-"+i);var d=document.getElementById("pid-"+i);
    if(n&&n.value.trim()){var pct=parseInt(p?p.value:0)||0;total+=pct;novos.push({nome:n.value.trim(),pct:pct,desc:d?d.value.trim():""});}
  }
  if(total!==100){alert("A soma tem de ser 100%. Actual: "+total+"%.");return;}
  CFG.pilares=novos; salvarCFG(); fecharModal(); renderBody();
}

function dlDoc(btn){
  var key=btn.getAttribute("data-eid");
  if(!window._projDocs) return;
  var content=window._projDocs[key];
  if(!content) return;
  var fname={"perfilMd":"perfil.md","servicosMd":"servicos.md","estrategiaMd":"estrategia.md","instrucoesMd":"instrucoes.md"}[key]||key+".md";
  downloadMd(content,fname);
}

function downloadMd(cnt,fname){
  if(!cnt){return;}
  var blob=new Blob([cnt],{type:"text/markdown;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadTodos(){
  if(!window._projDocs) document.getElementById("body").innerHTML=projectHTML();
  var docs=window._projDocs||{};
  var files=[{k:"perfilMd",f:"perfil.md"},{k:"servicosMd",f:"servicos.md"},{k:"estrategiaMd",f:"estrategia.md"},{k:"instrucoesMd",f:"instrucoes.md"}];
  files.forEach(function(item,i){
    setTimeout(function(){if(docs[item.k]) downloadMd(docs[item.k],item.f);},i*500);
  });
}
